<!doctype html>
<html lang = eng>
    <head>
        <meta charset = "UTF-8">
        <title>Student Registration Form</title>

        <style>
            body { background-color: lightgray; font-family: Arial, sans-serif; margin: 0; padding: 30px;
            }
            h1 { text-align: center; color: darkblue; }
            form { width: 500px; margin: auto; background-color: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px gray; }
            fieldset { border: 2px solid darkblue; border-radius: 8px; padding: 20px; }
            legend { color: darkblue; font-size: 20px; font-weight: bold; }
            label { font-weight: bold; }
            input[type="text"], input[type="email"], textarea, select { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 10px; box-sizing: border-box; border: 1px solid gray; border-radius: 5px; }
            input[type="submit"] { background-color: darkblue; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }

        </style>
    </head>
    <body>
        <h1>Student Registration Form</h1>

        <form>
            <fieldset>
                <legend>Personal Information</legend>

                <label>Full Name:</label>
                <input type="text" name="fullname"><br><br>

                <label>Email:</label>
                <input type="email" name="email"><br><br>

                <label>Gender:</label>
                <input type="radio" name="gender" value="male"> Male
                <input type="radio" name="gender" value="female"> Female
                <br><br>

                <label>Favourite Subjects:</label>
                <input type="checkbox" name="subject" value="html"> HTML
                <input type="checkbox" name="subject" value="css"> CSS
                <br><br>

                <label>Class:</label>
                <select name="class">
                <option>Beginner</option>
                <option>Intermediate</option>
                <option>Advanced</option>
                </select>
                <br><br>

               <label>Upload Passport:</label>
                <input type="file"><br><br>

                 <label>Address:</label><br>
                 <textarea rows="5" cols="30"></textarea><br><br>

                 <input type="submit" value="Register">

    </fieldset>

</form>
